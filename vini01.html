<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criador de Terror</title>
  <link rel="stylesheet" href="vini.css" />
</head>
<body>
  <h1>👻 Crie seu Monstro</h1>

  <form id="formPersonagem">
    <input type="text" id="nome" placeholder="Nome" required />
    <input type="text" id="tipo" placeholder="Tipo (ex: Zumbi)" required />
    <input type="number" id="perigo" min="1" max="5" placeholder="Perigo (1-5)" required />
    <button type="submit">Adicionar</button>
  </form>

  <hr />

  <div>
    <strong>Total: <span id="contador">0</span></strong>
  </div>

  <div class="acoes">
    <button class="btn-limpar" onclick="limparTudo()">🗑️ Limpar tudo</button>
  </div>

  <div id="listaPersonagens"></div>

  <script src="vini.js"></script>
</body>
</html>
